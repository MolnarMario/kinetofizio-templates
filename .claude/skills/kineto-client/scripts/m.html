<!doctype html><meta charset=utf-8><title>preview</title>
<!--
  Shows one page several times side by side, each in an iframe of a fixed size, one per anchor.
  m.html?u=http://127.0.0.1:PORT/slug/axa/&w=390&h=844&a=,servicii,echipa
  u = page, w/h = frame size (390x844 is a phone), a = anchors, empty = top of the page.
-->
<style>body{margin:0;background:#888;display:flex;gap:16px;padding:16px;align-items:flex-start}iframe{border:0;background:#fff;flex:none}</style>
<body>
<script>
var p=new URLSearchParams(location.search),u=p.get('u'),w=+(p.get('w')||390),h=+(p.get('h')||844),a=(p.get('a')||'').split(',');
a.forEach(function(x){var f=document.createElement('iframe');f.width=w;f.height=h;f.src=u+(x?'#'+x:'');document.body.appendChild(f);});
</script>
